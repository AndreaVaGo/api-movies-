# Nombre interno de la aplicacion (identifica el proyecto en logs, actuator, etc.)
spring.application.name=api-movies

# Prefijo de ruta base para todos los endpoints (usado como ${api-endpoint} en los @RequestMapping)
api-endpoint = api/v1

# Muestra en consola las sentencias SQL que genera Hibernate (util para depurar y aprender)
spring.jpa.show-sql=true

# Formatea el SQL mostrado en consola para que sea mas legible (con saltos de linea e indentacion)
spring.jpa.properties.hibernate.format_sql=true

# Crea las tablas que falten y actualiza su estructura si cambian las entidades, sin borrar los datos existentes
spring.jpa.hibernate.ddl-auto=create-drop

# Espera a que Hibernate termine de crear/actualizar las tablas antes de ejecutar data.sql (evita error de tabla inexistente)
spring.jpa.defer-datasource-initialization=true

# Ejecuta los scripts de inicialización (data.sql) siempre, sin importar si la base de datos es embebida o no
spring.sql.init.mode=always